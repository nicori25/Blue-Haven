name: Verificar juego
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DB_PASSWORD: bluehaven_ci_only
      DB_ROOT_PASSWORD: bluehaven_ci_root_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: docker compose up --build -d --wait
      - run: docker compose exec -T web sh -c 'for f in api/*.php; do php -l "$f" || exit 1; done'
      - run: npm test
      - run: npm run test:api
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: capturas-de-prueba
          path: test-results/
      - run: docker compose logs --no-color
        if: failure()
      - run: docker compose down
        if: always()
