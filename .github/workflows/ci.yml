name: Verificar juego con Supabase
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:vendor
      - run: git diff --exit-code -- libraries/supabase.min.js
      - run: npm run db:seed
      - run: git diff --exit-code -- supabase/seed.sql supabase/instalar.sql
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:supabase
      - run: python3 -m http.server 8080 > /tmp/bluehaven-web.log 2>&1 &
      - run: npm run test:browser
      - name: Probar cuentas en navegador con Supabase local
        run: |
          export SUPABASE_TEST_URL=http://127.0.0.1:54321
          export SUPABASE_TEST_ANON_KEY="$(node tests/supabase/token.cjs)"
          node tests/supabase-browser.cjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: capturas-de-prueba
          path: test-results/
      - run: docker compose -p bluehaven-supabase-test -f tests/supabase/compose.yaml logs --no-color
        if: failure()
      - run: docker compose -p bluehaven-supabase-test -f tests/supabase/compose.yaml down -v
        if: always()
