services:
  web:
    build: .
    ports:
      - "127.0.0.1:8080:80"
    environment:
      DB_HOST: db
      DB_NAME: bluehaven_db
      DB_USER: bluehaven
      DB_PASSWORD: ${DB_PASSWORD:?Definí DB_PASSWORD en .env}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: bluehaven_db
      MARIADB_USER: bluehaven
      MARIADB_PASSWORD: ${DB_PASSWORD:?Definí DB_PASSWORD en .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Definí DB_ROOT_PASSWORD en .env}
    volumes:
      - partida:/var/lib/mysql
      - ./bd/bluehaven_db.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./bd/datos_peces.sql:/docker-entrypoint-initdb.d/02-especies.sql:ro
      - ./bd/002_integracion.sql:/docker-entrypoint-initdb.d/03-integracion.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  partida:
